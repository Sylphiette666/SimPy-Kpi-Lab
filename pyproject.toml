[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpy-kpi-lab"
version = "0.1.0"
description = "A reproducible SimPy experimentation framework with KPI statistics and OpenAI analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SimPy KPI Lab" }]
dependencies = [
  "simpy>=4.1.1,<5",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "openai>=1.68.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
simlab = "simlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

